services:
  backend:
    build:
      context: ./backend
    image: trustsci-agent-backend:latest
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_TEMPERATURE: ${QWEN_TEMPERATURE:-0.2}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-60}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-1}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      MAX_PAPERS: ${MAX_PAPERS:-6}
      MATERIALS_PROJECT_API_KEY: ${MATERIALS_PROJECT_API_KEY:-}
      BROWSER_WORKER_URL: ${BROWSER_WORKER_URL:-http://browser-worker:8010}
      DATA_DIR: /app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runner
    image: trustsci-agent-frontend:latest
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      browser-worker:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  browser-worker:
    build:
      context: ./browser-worker
    image: trustsci-agent-browser-worker:latest
    ports:
      - "${BROWSER_WORKER_PORT:-8010}:8010"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
